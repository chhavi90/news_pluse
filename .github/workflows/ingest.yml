# Scheduled run of the Python pipeline (scrape + extract + cluster) against the hosted database.
# Setup: repo Settings > Secrets and variables > Actions > New repository secret > DATABASE_URL
name: Ingest news
on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:            # "Run workflow" button for a manual run

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Run pipeline
        run: python -m scraper.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
